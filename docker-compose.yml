services:
  miaomiaowus:
    image: ${MMW_IMAGE:-ghcr.io/yuu518/miaomiaowus}:${MMW_VERSION:-latest}
    container_name: miaomiaowus
    restart: unless-stopped
    user: root
    environment:
      - PORT=11996
      - DATABASE_PATH=/app/data/traffic.db
      - LOG_LEVEL=info
      - MMW_DATABASE_DRIVER=${MMW_DATABASE_DRIVER:-}
      - MMW_DATABASE_HOST=${MMW_DATABASE_HOST:-}
      - MMW_DATABASE_PORT=${MMW_DATABASE_PORT:-}
      - MMW_DATABASE_NAME=${MMW_DATABASE_NAME:-}
      - MMW_DATABASE_USER=${MMW_DATABASE_USER:-}
      - MMW_DATABASE_PASSWORD=${MMW_DATABASE_PASSWORD:-}
      - MMW_DATABASE_SSLMODE=${MMW_DATABASE_SSLMODE:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    ports:
      - "${PORT:-11996}:11996"
    volumes:
      - ./data:/app/data
      - ./subscribes:/app/subscribes
      - ./rule_templates:/app/rule_templates
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11996/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  postgres:
    image: postgres:18-alpine
    container_name: miaomiaowus-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${MMW_DATABASE_NAME:-mmw}
      POSTGRES_USER: ${MMW_DATABASE_USER:-mmw}
      POSTGRES_PASSWORD: ${MMW_DATABASE_PASSWORD:-}
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
